# アプリアイコン生成設定。`dart run flutter_launcher_icons` で各プラットフォームへ反映。
flutter_launcher_icons:
  image_path: "assets/branding/icon_opaque.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ のアダプティブアイコン（背景=ブランド色、前景=白ロゴ）
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/branding/foreground.png"
